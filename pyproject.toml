[tool.ruff]
target-version = "py311"
line-length = 100
include = ["*.py", "notebooks/*.ipynb"]
# Archived source describes past runs and is immutable evidence.
extend-exclude = ["notebooks/assets/**/recorded_run/source", "notebooks/assets/**/recorded_eos_comparison/source", "notebooks/assets/historical_notebooks"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
